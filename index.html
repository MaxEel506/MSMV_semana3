<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    </head>
    <body class="bg-gray-100">
        <nav class="bg-white p-4 flex justify-between p-4 items-center">
            <ul class="flex justify-start flex-wrap w-full space-x-4">
                <li><a href="./index.html" class="text-2xl font-bold text-center">home</a></li>
                <li><a href="./busqueda.html" class="text-2xl font-bold text-center">busqueda</a></li>
                <li><a href="./maquina.html" class="text-2xl font-bold text-center">maquina</a></li>
            </ul>
        </nav>
        <form id="pago-form" class="bg-white p-6 rounded shadow-md items-center justify-center w-full max-w-md mx-auto mt-10">
            <h2 class="text-xl mb-4 font-bold">Favor de ingresar tus credenciales</h2>
            <label for="nombre" class="block mb-2">Nombre en el Gafete VIP:</label>
            <input type="text" id="nombre" name="username" required class="border border-gray-300 p-2 rounded w-full mb-4" onkeyup="ContarCaracteres(event)">
            <label for="zona" class="block mb-2">Zona:</label>
            <select id="zona" name="zona" required class="border border-gray-300 p-2 rounded w-full mb-4" onchange="ActualizarPrecio()">
                <option value="">Selecciona una zona</option>
                <option value="general" id="general">General</option>
                <option value="gradas" id="gradas">Gradas</option>
                <option value="snake-pit-vip" id="snake-pit-vip">Snake Pit VIP</option>
            </select>
            <p id="precioTotal" class="text-lg font-bold text-gray-500 mb-4"></p>
            <p id="contadorCaracteres" class="text-sm text-gray-500 mb-4"></p>
            <p id="error" class="text-sm text-red-500 mb-4"></p>
            <button type="submit" class="bg-red-500 text-white p-2 rounded" onclick="Comprar(event)">CONFIRMAR COMPRA</button>
        </form>
        <script src="./login.js" defer></script>
    </body>
</html>
